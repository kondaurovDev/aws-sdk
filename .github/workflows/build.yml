name: Build Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node, pnpm and install deps
        uses: ./.github/actions/setup

      - name: Build the generator
        run: pnpm run build

      # The demo consumes the freshly built CLI: its typecheck and tests verify
      # the generated code against real AWS SDK clients.
      - name: Generate the demo clients
        run: pnpm run generate

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test
